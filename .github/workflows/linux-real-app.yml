            ${{ runner.temp }}/i6-n04/n04-idle_125s-environment.json
            ${{ runner.temp }}/i6-n04/n04-idle_125s-receipt.json
            ${{ runner.temp }}/i6-n04/n04-acceptance-idle_125s.json
            ${{ runner.temp }}/i6-n04/n04-acceptance-idle_125s-validation.json
            ${{ runner.temp }}/i6-n04/container.json
          if-no-files-found: warn
          retention-days: 3

  v3_n05:
