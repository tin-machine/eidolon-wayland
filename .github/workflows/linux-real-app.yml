        run: bash scripts/ci/check-linux-desktop-v3-n05 --artifact-root "$RUNNER_TEMP/i6-n05"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: linux-desktop-v3-n05-${{ github.sha }}
          path: |
