  v3_n04:
    needs: scope
    if: ${{ needs.scope.outputs.mousepad == 'true' }}
    name: N04 125s real idle / heartbeat ACK / fresh GTK dialog (partial I6)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
