            ${{ runner.temp }}/i6-n07-b1/n07-b1-native.json
            ${{ runner.temp }}/i6-n07-b1/n07-b1-environment.json
            ${{ runner.temp }}/i6-n07-b1/container.json
          if-no-files-found: warn
          retention-days: 3


  v3_n07_b2:
    needs: scope
    if: ${{ needs.scope.outputs.mousepad == 'true' }}
    name: N07-B2 real Line Numbers candidate / four renderer ROIs (NOT acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
