      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: N04 frozen case and adversarial monotonic timeline
        run: python3 -m unittest discover -s scripts/tests -p 'test_linux_real_app_v3_n04.py' -v
      - name: N04 same-capture 127s idle with 5s heartbeat / 15s C2 lease
        env:
          CI_PR_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
