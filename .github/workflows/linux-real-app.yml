name: L7a foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eidolon-real-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    name: CI scope (L7a)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      host: ${{ steps.paths.outputs.host }}
      android: ${{ steps.paths.outputs.android }}
      settings: ${{ steps.paths.outputs.settings }}
      mousepad: ${{ steps.paths.outputs.mousepad }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths (baseline-controlled PR classifier)
        id: paths
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          script=scripts/ci/ci_scope.py
          # On PRs, prefer the trusted base branch copy: changing the gate
          # itself must not allow the submitted PR to suppress its own tests.
          if [[ "$CI_EVENT" == "pull_request" ]] && git cat-file -e "${CI_BASE_SHA}:scripts/ci/ci_scope.py" 2>/dev/null; then
            git show "${CI_BASE_SHA}:scripts/ci/ci_scope.py" > "$RUNNER_TEMP/ci_scope.py"
            script="$RUNNER_TEMP/ci_scope.py"
          fi
          python3 "$script"
  settings:
    needs: scope
    if: ${{ needs.scope.outputs.settings == 'true' }}
    name: GIO policy and recovery guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: GIO development dependencies
        run: python3 scripts/ci/install_apt_deps.py build-essential pkg-config libglib2.0-dev
      - name: Actual GIO module tests (missing dependencies fail)
        env:
          EIDOLON_REQUIRE_GIO_TESTS: '1'
        run: python3 -m unittest discover -s scripts/tests -p 'test_linux_settings_backend.py' -v
      - name: Read-only package and recovery-data tests
        env:
          EIDOLON_REQUIRE_GUI_OBSERVER_TESTS: '1'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_linux_real_app_inspect.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_linux_real_app_check.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_linux_real_app_gui.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_linux_real_app_gui_observer.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_linux_real_app_gui_evidence.py' -v
      - name: Termination and live descendant ownership regressions
        env:
          EIDOLON_REQUIRE_LIFECYCLE_TESTS: '1'
        run: |
          test "$(id -u)" -ne 0
          python3 -m unittest discover -s scripts/tests -p 'test_linux_real_app_wayland.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_linux_real_app_profile.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_linux_real_app_harness.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_linux_real_app_lifecycle.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_linux_real_app_harness_lifecycle.py' -v

  mousepad:
    needs: scope
    if: ${{ needs.scope.outputs.mousepad == 'true' }}
    name: Pinned Mousepad and real Waypipe foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-real-app-rust1.95.0-${{ hashFiles('Cargo.lock', 'scripts/fixtures/linux-real-app-wayland/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Explicit CI dependencies
        run: |
          python3 scripts/ci/install_apt_deps.py build-essential autoconf automake libtool gettext autopoint xfce4-dev-tools \
            libgtk-3-dev libgtksourceview-4-dev pkg-config dbus ninja-build bison perl patch cmake
          rustup toolchain install 1.95.0 --profile minimal
      - name: Build the existing fixed Waypipe and production compositor dependencies
        run: |
          scripts/build-native-deps --target host
          scripts/build-waypipe --target host
          # Match the A0 builder's explicit host toolchain. Root workspace
          # rustfmt/clippy/Android components are checked by the existing CI.
          cargo +1.95.0 test --locked --manifest-path scripts/fixtures/linux-real-app-wayland/Cargo.toml --target-dir target
      - name: Build the unmodified pinned Mousepad test package
        run: python3 scripts/ci/prepare-linux-real-app-fixture --stage build --work-directory "$RUNNER_TEMP/mousepad-a0"
      - name: Install only on the ephemeral CI runner and record reviewed inputs
        run: |
          sudo dpkg --install "$RUNNER_TEMP/mousepad-a0/mousepad-a0.deb"
          sudo ldconfig
          sudo glib-compile-schemas --strict /usr/share/glib-2.0/schemas
          # Hosted images intentionally chmod -R 777 /usr/share. The static
          # inspector requires protected package/schema evidence. Establish
          # that prerequisite on this ephemeral test runner; never weaken it.
          # https://github.com/actions/runner-images/blob/fad015e47059f40cf0786dcb4593384f6a0720d3/images/ubuntu/scripts/build/configure-system.sh
          sudo chmod go-w /usr/share /usr/share/doc /usr/share/glib-2.0 \
            /usr/share/glib-2.0/schemas /usr/share/glib-2.0/schemas/gschemas.compiled
          python3 scripts/ci/prepare-linux-real-app-fixture --stage inventory --work-directory "$RUNNER_TEMP/mousepad-a0"
          scripts/inspect-linux-real-app --reviewed-package "$RUNNER_TEMP/mousepad-a0/reviewed-package.json" \
            --artifact-root "$RUNNER_TEMP/mousepad-inspection"
      - name: Observe A0 GUI persistence, protected Preferences, 125-second hold and lifecycle cases
        run: |
          python3 scripts/ci/check-linux-real-app-foundation \
            --precursor-hold-check \
            --reviewed-package "$RUNNER_TEMP/mousepad-a0/reviewed-package.json" \
            --artifact-root "$RUNNER_TEMP/real-app-foundation"
      - name: Fixed-source compiler diagnostics on failure
        if: ${{ failure() }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          base = pathlib.Path(os.environ['RUNNER_TEMP']) / 'real-app-foundation'
          for relative in ('settings-bundle/build.log', 'gui-observer/build.log', 'compositor-build.log'):
              path = base / relative
              if path.is_file():
                  text = path.read_bytes()[-16384:].decode('utf-8', errors='replace')
                  print(relative)
                  print(text.replace(str(base), '<artifact>').replace(os.environ['GITHUB_WORKSPACE'], '<source>'))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: linux-real-app-foundation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mousepad-inspection/inspection.json
            ${{ runner.temp }}/real-app-foundation/feasibility.json
            ${{ runner.temp }}/real-app-foundation/wayland/wayland.json
            ${{ runner.temp }}/real-app-foundation/wayland/precursor/runs/*/wayland.json
            ${{ runner.temp }}/real-app-foundation/wayland/target/runs/*/wayland.json
          if-no-files-found: warn
          retention-days: 3

  v3_n01:
    needs: scope
    if: ${{ needs.scope.outputs.mousepad == 'true' }}
    name: N01 real SSH / Inspect-only (partial I6)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Rust formatting in an isolated source copy
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          i6_format_dir=$(mktemp -d "$RUNNER_TEMP/n01-format.XXXXXXXX")
          git clone --quiet --no-local --no-hardlinks "$GITHUB_WORKSPACE" "$i6_format_dir/source"
          git -C "$i6_format_dir/source" checkout --quiet --detach "$GITHUB_SHA"
          cd "$i6_format_dir/source"
          i6_format_failed=0
          cargo +1.95.0 fmt --all -- --check || i6_format_failed=1
          cargo +1.95.0 fmt --manifest-path scripts/fixtures/linux-real-app-v3-host/Cargo.toml -- --check || i6_format_failed=1
          if [[ "$i6_format_failed" == 1 ]]; then
            # Produce a reviewable patch, never alter the checkout being tested.
            cargo +1.95.0 fmt --all
            cargo +1.95.0 fmt --manifest-path scripts/fixtures/linux-real-app-v3-host/Cargo.toml
            git diff --binary > "$RUNNER_TEMP/n01-rustfmt.patch"
            echo '::error::Rust formatting must pass for the workspace and standalone N01 runner.'
            exit 1
          fi
      - name: Disposable container build and real N01 smoke
        run: bash scripts/ci/check-linux-desktop-v3-n01 --artifact-root "$RUNNER_TEMP/i6-n01"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: linux-desktop-v3-n01-${{ github.sha }}
          path: |
            ${{ runner.temp }}/i6-n01/acceptance.json
            ${{ runner.temp }}/i6-n01/acceptance-validation.json
            ${{ runner.temp }}/i6-n01/n01-validation.json
            ${{ runner.temp }}/i6-n01/n01-receipt.json
            ${{ runner.temp }}/i6-n01/n01-native.json
            ${{ runner.temp }}/i6-n01/container.json
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: linux-desktop-v3-n01-rustfmt-${{ github.sha }}
          path: ${{ runner.temp }}/n01-rustfmt.patch
          if-no-files-found: ignore
          retention-days: 3

  v3_renderer:
    needs: scope
    if: ${{ needs.scope.outputs.mousepad == 'true' }}
    name: I6 real Host EGL / SHM renderer (T evidence)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check standalone renderer fixture formatting
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          cargo +1.95.0 fmt --manifest-path scripts/fixtures/linux-real-app-v3-renderer/Cargo.toml -- --check
      - name: Real SHM / llvmpipe / bounded readback / retirement in a disposable container
        env:
          CI_PR_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: bash scripts/ci/check-linux-desktop-v3-renderer --artifact-root "$RUNNER_TEMP/i6-renderer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: linux-desktop-v3-renderer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/i6-renderer/renderer-native.json
            ${{ runner.temp }}/i6-renderer/renderer-unavailable.json
            ${{ runner.temp }}/i6-renderer/renderer-environment.json
            ${{ runner.temp }}/i6-renderer/renderer-validation.json
            ${{ runner.temp }}/i6-renderer/renderer-container.json
          if-no-files-found: warn
          retention-days: 3

  v3_n02:
    needs: scope
    if: ${{ needs.scope.outputs.mousepad == 'true' }}
    name: N02 real Registry Launch / synthetic SDK / GTK and Mousepad (partial I6)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Explicit source-bound N02 Host unit tests and actual disposable N02 smoke
        run: bash scripts/ci/check-linux-desktop-v3-n02 --artifact-root "$RUNNER_TEMP/i6-n02"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: linux-desktop-v3-n02-${{ github.sha }}
          path: |
            ${{ runner.temp }}/i6-n02/n02-validation.json
            ${{ runner.temp }}/i6-n02/n02-gtk3_desktop-native.json
            ${{ runner.temp }}/i6-n02/n02-gtk3_desktop-environment.json
            ${{ runner.temp }}/i6-n02/n02-mousepad_editor-native.json
            ${{ runner.temp }}/i6-n02/n02-mousepad_editor-environment.json
            ${{ runner.temp }}/i6-n02/container.json
          if-no-files-found: warn
          retention-days: 3
