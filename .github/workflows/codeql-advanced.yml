name: CodeQL Advanced (staged, five languages)

# STAGING: while Default setup is active, all analyses run locally with
# upload: never. GitHub repository variable EIDOLON_CODEQL_ADVANCED_ENABLED
# must remain unset or "false" until Default setup is disabled. Changing that
# variable to "true" is the explicit activation step after validation.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-advanced-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    # Pull requests/dispatch are dry-run verifications before activation; push
    # and weekly schedule cost no jobs until the repo variable is enabled.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || vars.EIDOLON_CODEQL_ADVANCED_ENABLED == 'true' }}
    name: CodeQL Advanced (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: rust
            build-mode: none
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java for Kotlin
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Install SDK for Kotlin compilation
        if: ${{ matrix.language == 'java-kotlin' }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          manager = sdk / 'cmdline-tools/latest/bin/sdkmanager'
          assert manager.is_file(), 'Android SDK command-line tools are missing'
          subprocess.run([str(manager), '--sdk_root=' + str(sdk), '--licenses'],
                         input='y\n' * 100, text=True, check=True)
          subprocess.run([str(manager), '--sdk_root=' + str(sdk),
                          'platforms;android-36', 'build-tools;35.0.0'], check=True)
          PY

      - name: Check Kotlin task graph does not require native build
        if: ${{ matrix.language == 'java-kotlin' }}
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          tasks=(
            :app:compileDebugKotlin
            :app:compileReleaseKotlin
            :probe:compileDebugKotlin
            :app:compileDebugUnitTestKotlin
          )
          ./gradlew --no-daemon --console=plain "${tasks[@]}" --dry-run \
            | tee "$RUNNER_TEMP/codeql-kotlin-task-graph.txt"
          if grep -E '(^|[[:space:]]):[^[:space:]]*(build(Debug|Release)EidolonNative|nativeProbe)([[:space:]]|$)' "$RUNNER_TEMP/codeql-kotlin-task-graph.txt"; then
            echo "::error::A native build is in the Kotlin-only CodeQL task graph"
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Keep default query suite for parity with CodeQL Default setup.

      - name: Compile Kotlin under CodeQL tracing (no APK)
        if: ${{ matrix.language == 'java-kotlin' }}
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          tasks=(
            :app:compileDebugKotlin
            :app:compileReleaseKotlin
            :probe:compileDebugKotlin
            :app:compileDebugUnitTestKotlin
          )
          ./gradlew --no-daemon --console=plain --rerun-tasks "${tasks[@]}"
          for classes in \
            app/build/tmp/kotlin-classes/debug \
            app/build/tmp/kotlin-classes/release \
            probe/build/tmp/kotlin-classes/debug \
            app/build/tmp/kotlin-classes/debugUnitTest
          do
            test -d "$classes" || {
              echo "::error::Missing Kotlin compiler output: $classes"
              exit 1
            }
            count="$(find "$classes" -type f -name '*.class' | wc -l)"
            echo "Compiled Kotlin/JVM classes in $classes: $count"
            test "$count" -gt 0 || {
              echo "::error::Zero Kotlin/JVM classes compiled in $classes"
              exit 1
            }
          done

      # Do not upload while Default setup remains active: it overrides
      # conflicting Advanced setup results. Only an explicit repository
      # variable change following the Default -> Advanced settings switch
      # turns on upload. Do not use a loose 'false' value here.
      - name: Analyze CodeQL / upload only after activation
        id: codeql-analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ vars.EIDOLON_CODEQL_ADVANCED_ENABLED == 'true' && 'always' || 'never' }}
          upload-database: false
          output: ${{ runner.temp }}/codeql-advanced-results-${{ matrix.language }}

      - name: Verify local CodeQL SARIF
        env:
          SARIF_ROOT: ${{ steps.codeql-analyze.outputs.sarif-output }}
          LANG: ${{ matrix.language }}
          UPLOAD_MODE: ${{ vars.EIDOLON_CODEQL_ADVANCED_ENABLED == 'true' && 'always' || 'never' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["SARIF_ROOT"])
          paths = sorted(root.rglob("*.sarif"))
          assert paths, f"No CodeQL SARIF files in {root}"
          total = 0
          for path in paths:
              payload = json.loads(path.read_text())
              assert payload.get("version") == "2.1.0", path
              total += len(payload.get("runs", []))
          assert total > 0, f"No CodeQL run in {paths}"
          message = (f"CodeQL {os.environ['LANG']}: {len(paths)} SARIF file(s), "
                     f"{total} run(s); upload mode {os.environ['UPLOAD_MODE']}")
          print(message)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write(message + "\n")
          PY
