name: 検証

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eidolon-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    name: CI scope (host/android)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      host: ${{ steps.paths.outputs.host }}
      android: ${{ steps.paths.outputs.android }}
      settings: ${{ steps.paths.outputs.settings }}
      mousepad: ${{ steps.paths.outputs.mousepad }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths (baseline-controlled PR classifier)
        id: paths
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          script=scripts/ci/ci_scope.py
          # On PRs, prefer the trusted base branch copy: changing the gate
          # itself must not allow the submitted PR to suppress its own tests.
          if [[ "$CI_EVENT" == "pull_request" ]] && git cat-file -e "${CI_BASE_SHA}:scripts/ci/ci_scope.py" 2>/dev/null; then
            git show "${CI_BASE_SHA}:scripts/ci/ci_scope.py" > "$RUNNER_TEMP/ci_scope.py"
            script="$RUNNER_TEMP/ci_scope.py"
          fi
          python3 "$script"
  host:
    needs: scope
    if: ${{ needs.scope.outputs.host == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Actionsの構文・contextを検証
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/check.yml .github/workflows/linux-real-app.yml
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-host-debug-rust1.95.0-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Rust固定版を導入
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target aarch64-linux-android
      - name: SSH・GTK fixture用の依存を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server ninja-build bison perl patch cmake pkg-config libgtk-3-dev xvfb
      - name: host suiteを検証
        run: scripts/check-host --suite all
      - name: Waypipe経由clipboardの上限と仲介bufferの範囲を確認
        run: scripts/check-waypipe-clipboard
      - name: Waypipe両端でIMEの配送・失効・資源回収を検証
        run: scripts/check-waypipe-ime

  android:
    needs: scope
    if: ${{ needs.scope.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-arm64-api34-ndk27.3.13750724-debug-rust1.95.0-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'ci/toolchains.lock.json') }}
      - name: Rust・cargo-ndk固定版を導入
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --target aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: native・host GTK検査の依存を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison patch cmake pkg-config libgtk-3-dev xvfb
      - name: Android SDK・NDK固定版を導入
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          manager = sdk / 'cmdline-tools/latest/bin/sdkmanager'
          assert manager.is_file(), 'Android command-line toolsがありません'
          subprocess.run([str(manager), '--sdk_root=' + str(sdk), '--licenses'], input='y\n' * 100, text=True, check=True)
          subprocess.run([str(manager), '--sdk_root=' + str(sdk), 'platforms;android-36', 'build-tools;35.0.0', 'ndk;27.3.13750724'], check=True)
          PY
      - name: debug APK・lint・ELF/版/同梱検査
        env:
          EIDOLON_ARTIFACT_ROOT: ${{ runner.temp }}/eidolon-ci-build
        run: scripts/build-android 1
      - name: JUnitの実行件数とskipを記録
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          reports = sorted(pathlib.Path('android/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          rows = []
          invalid = []
          for path in reports:
              try:
                  suite = ET.parse(path).getroot()
                  assert suite.tag == 'testsuite'
                  counts = [int(suite.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')]
                  assert all(value >= 0 for value in counts)
                  assert sum(counts[1:]) <= counts[0]
                  rows.append((suite.get('name', path.stem), counts))
              except (ET.ParseError, ValueError, AssertionError, OSError):
                  invalid.append(path.name)
          lines = ['## Android JVM JUnit', '',
                   'JUnit XMLの件数です。端末instrumentation・Quest実機・実回収の証拠ではありません。', '']
          if rows:
              total = [sum(row[1][index] for row in rows) for index in range(4)]
              lines += ['| Suite | Total | Passed | Failed | Errors | Skipped |',
                        '| --- | ---: | ---: | ---: | ---: | ---: |']
              selected = [('All reported suites', total)] + [row for row in rows if row[0].split('.')[-1].startswith('LinuxStorage')]
              for name, (tests, failures, errors, skipped) in selected:
                  lines.append(f'| {name} | {tests} | {tests-failures-errors-skipped} | {failures} | {errors} | {skipped} |')
          else:
              lines.append('JUnit XMLがありません。テスト成功・実行件数は認定しません。')
          if invalid:
              lines += ['', '読み取れないXML（上記集計に含めません）: ' + ', '.join(invalid)]
          summary = '\n'.join(lines) + '\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write(summary)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: eidolon-junit-${{ github.sha }}
          path: android/app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: warn
          retention-days: 3
      - name: 実APKの拒否検査
        env:
          EIDOLON_TEST_APK: android/app/build/outputs/apk/debug/app-debug.apk
        run: python3 -m unittest discover -s scripts/tests -v
      - name: License and NOTICE gate (APK download/publication)
        run: python3 scripts/check-apk-license --apk android/app/build/outputs/apk/debug/app-debug.apk
      # Source may become public before every third-party APK notice is reviewed.
      # Never expose newly built debug APKs from a public repository automatically.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ success() && github.event.repository.private }}
        with:
          name: eidolon-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  report:
    if: ${{ always() && github.event_name != 'pull_request' && needs.scope.result == 'success' && (needs.scope.outputs.host == 'true' || needs.scope.outputs.android == 'true') }}
    needs: [scope, host, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: 対象commitへhost/Android結果を記録
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_SCOPE_OUTPUTS: ${{ toJSON(needs.scope.outputs) }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_SHA: ${{ github.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          results = json.loads(os.environ['CI_NEEDS'])
          required = json.loads(os.environ['CI_SCOPE_OUTPUTS'])
          endpoint = 'https://api.github.com/repos/' + os.environ['CI_REPOSITORY'] + '/statuses/' + os.environ['CI_SHA']
          for job in ('host', 'android'):
              outcome = results[job]['result']
              if outcome == 'skipped' and required[job] == 'false':
                  print(job + ': not applicable (scoped out)')
                  continue
              state = {'success': 'success', 'failure': 'failure'}.get(outcome, 'error')
              payload = {'state': state, 'context': 'eidolon/' + job, 'description': job + ': ' + outcome, 'target_url': os.environ['CI_RUN_URL']}
              request = urllib.request.Request(endpoint, data=json.dumps(payload).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 201
              print(job + ': ' + state)
          PY
