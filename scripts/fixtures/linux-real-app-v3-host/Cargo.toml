[package]
name = "eidolon-i6-n01-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace]

[dependencies]
eidolon-android = { path = "../../../native/android", features = ["host-acceptance"] }
eidolon-core = { path = "../../../native/core", features = ["host-acceptance"] }
eidolon-model = { path = "../../../native/model" }
eidolon-render = { path = "../../../native/render", features = ["host-acceptance"] }
eidolon-transport = { path = "../../../native/transport", features = ["host-acceptance"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
libc = "0.2"

[patch.crates-io]
smithay = { path = "../../../native/generated/smithay" }

[profile.dev]
debug = 1
