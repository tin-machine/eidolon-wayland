[package]
name = "eidolon-i6-renderer-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace]

[dependencies]
eidolon-core = { path = "../../../native/core", features = ["host-acceptance"] }
eidolon-render = { path = "../../../native/render", features = ["host-acceptance"] }
eidolon-model = { path = "../../../native/model" }
eidolon-theme = { path = "../../../native/theme" }
eidolon-shm-fixture = { path = "../../../native/fixtures/shm-client" }
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "desktop"] }
serde_json = "1"
sha2 = "0.11"
libc = "0.2"

[patch.crates-io]
smithay = { path = "../../../native/generated/smithay" }

[profile.dev]
debug = 1
