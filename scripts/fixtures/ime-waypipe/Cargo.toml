[package]
name = "ime-waypipe-probe"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
eidolon-core = { path = "../../../native/core", features = ["debug-fixtures"] }
eidolon-model = { path = "../../../native/model" }
eidolon-shm-fixture = { path = "../../../native/fixtures/shm-client" }
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "desktop"] }
serde_json = "1"
libc = "0.2"

[patch.crates-io]
smithay = { path = "../../../native/generated/smithay" }

[profile.dev]
debug = 1
