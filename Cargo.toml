[workspace]
members = ["native/model", "native/android"]
default-members = ["native/model"]
exclude = ["probes/native"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eidolon-model = { path = "native/model" }

[profile.dev]
debug = 1
