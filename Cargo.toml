[workspace]
members = ["native/model", "native/core", "native/render", "native/transport", "native/android", "native/fixtures/helper-probe", "native/fixtures/shm-client", "native/theme"]
default-members = ["native/model"]
exclude = ["probes/native", "native/generated/smithay"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eidolon-model = { path = "native/model" }
eidolon-core = { path = "native/core" }
eidolon-render = { path = "native/render" }
eidolon-transport = { path = "native/transport" }
eidolon-theme = { path = "native/theme" }
zeroize = "1"
libc = "0.2"

[profile.dev]
debug = 1

[patch.crates-io]
smithay = { path = "native/generated/smithay" }
