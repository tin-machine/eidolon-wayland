format_version = 2
id = "cyan-orbit"
name = "Cyan Orbit"
style = "style.css"

[parts.ring-outer]
kind = "svg-mask"
src = "assets/outer.svg"
slot = "window-backdrop"
size = [1200.0, 1200.0]
order = 0

[parts.ring-middle]
kind = "svg-mask"
src = "assets/middle.svg"
slot = "window-backdrop"
size = [1040.0, 1040.0]
order = 1

[parts.ring-inner]
kind = "svg-mask"
src = "assets/inner.svg"
slot = "window-backdrop"
size = [880.0, 880.0]
order = 2

[parts.cpu-meter]
kind = "meter"
slot = "titlebar-bottom"
size = [160.0, 3.0]

[[bindings]]
part = "cpu-meter"
property = "-eidolon-value"
metric = "workload.cpu.cores"
input = [0.0, 4.0]
output = [0.0, 1.0]
clamp = true
missing = "hold-last"

[[rotations]]
part = "ring-outer"
metric = "workload.cpu.cores"
input_max = 4.0
degrees_per_second = 60.0

[[rotations]]
part = "ring-middle"
metric = "workload.memory.rss_bytes"
input_max = 1073741824.0
degrees_per_second = -40.0
