[package]
name = "eidolon-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "eidolon_native"
crate-type = ["cdylib", "rlib"]

[features]
host-acceptance = ["eidolon-core/host-acceptance", "eidolon-transport/host-acceptance"]

[dependencies]
eidolon-model.workspace = true
eidolon-core.workspace = true
eidolon-render.workspace = true
eidolon-transport.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"
eidolon-spatial-anchor = { path = "../spatial-anchor" }
