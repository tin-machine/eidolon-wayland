[package]
name = "eidolon-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
eidolon-model.workspace = true
eidolon-render.workspace = true
eidolon-theme.workspace = true
eidolon-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "desktop"] }
xkbcommon = { version = "=0.8.0", default-features = false }
nix = { version = "=0.31.3", features = ["fs", "socket", "uio"] }
memmap2 = "=0.9.12"
sha2 = "0.11"
eidolon-shm-fixture = { path = "../fixtures/shm-client", optional = true }

[features]
debug-fixtures = ["dep:eidolon-shm-fixture", "eidolon-render/debug-fixtures"]

[dev-dependencies]
eidolon-render = { workspace = true, features = ["debug-fixtures"] }
eidolon-shm-fixture = { path = "../fixtures/shm-client" }

[build-dependencies]
serde_json.workspace = true
sha2 = "0.11"
