[package]
name = "eidolon-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
eidolon-model.workspace = true
eidolon-theme.workspace = true
cgmath = "=0.18.0"
serde.workspace = true
libc.workspace = true
smithay = { version = "=0.7.0", default-features = false, features = ["renderer_gl"] }

[features]
debug-fixtures = []

[target.'cfg(target_os = "android")'.dependencies]
ndk = "=0.9.0"
khronos-egl = { version = "=6.0.0", features = ["dynamic"] }

[build-dependencies]
serde_json.workspace = true
sha2 = "0.11"

[dev-dependencies]
khronos-egl = { version = "=6.0.0", features = ["dynamic"] }
serde_json.workspace = true
