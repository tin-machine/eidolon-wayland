[package]
name = "eidolon-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "eidolon_probe"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
libc = "0.2"
russh = { version = "=0.65.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util", "sync"], optional = true }
rand = { version = "0.10", optional = true }
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "desktop"], optional = true }
xkbcommon = { version = "=0.8.0", optional = true }

[features]
ssh = ["dep:russh", "dep:tokio", "dep:rand"]
compositor = ["dep:smithay", "dep:xkbcommon"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"
ndk = "=0.9.0"
khronos-egl = { version = "=6.0.0", features = ["dynamic"] }
